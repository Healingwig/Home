# Para ejecutarlo en tu propio equipo (desarrollo, o si algún día prefieres no
# depender de la nube). El despliegue normal es Cloud Run: ver docs/despliegue.md.
services:
  recetas:
    build: .
    container_name: recetas
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      STORAGE_BACKEND: local
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    extra_hosts:
      # Para OLLAMA_HOST=http://host.docker.internal:11434 si usas un modelo local.
      - "host.docker.internal:host-gateway"
